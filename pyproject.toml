[project]
name = "androidrepo-bot"
version = "0.1.0"
description = "Telegram bot for reviewed Android Repository channel posts"
readme = "README.md"
authors = [{ name = "Hitalo M." }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "aiohttp[speedups]>=3.14.4,<4",
    "alembic>=1.20,<2",
    "asyncpg>=0.31,<1",
    "markdown-it-py>=4.2,<5",
    "pillow>=12.3,<13",
    "pydantic>=2.13.5,<3",
    "pydantic-ai-slim[openai]>=2.54,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<3",
    "structlog>=26.1,<27",
    "uvloop>=0.23,<1",
]

[project.scripts]
androidrepo-bot = "androidrepo_bot.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "pyright>=1.1.414,<2",
    "ruff>=0.16.10,<0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
