# Android Repository Bot configuration example.
# Copy to config.toml and replace the required placeholders.
# Use --config /path/to/config.toml to select another file.
# Settings come only from TOML; environment variables are not loaded.
# Never commit the populated file. Restrict its permissions (chmod 600).

# Telegram
# Required. Bot token issued by BotFather.
bot_token = "replace-with-your-bot-token"

# Required. Staff chat admitted to the post workflow.
# Telegram supergroup and channel IDs commonly start with `-100`.
staff_chat_id = -1001234567890

# Required. Positive message-thread ID for the staff topic where `/post`,
# `/cancel`, and draft callbacks are handled.
post_topic_id = 123

# Required. Positive message-thread ID for best-effort operational audit
# messages. Audit delivery failures do not stop the main workflow.
log_topic_id = 456

# Required. Target channel for explicitly confirmed posts.
# The bot must have permission to copy messages into this channel.
channel_id = -1009876543210

# Runtime logging
# Optional. Accepted values: CRITICAL, ERROR, WARNING, INFO, DEBUG.
log_level = "INFO"

# AI generation
# Required. OpenCode Console credential for the OpenAI-compatible inference endpoint.
opencode_zen_api_key = "replace-with-your-opencode-zen-api-key"

# Optional. Non-empty OpenCode Zen model identifier.
opencode_zen_model = "mimo-v2.6-flash-free"

# Repository providers
# Optional. Leave blank for anonymous public API requests. Configure tokens for
# authenticated GitHub/GitLab requests and their associated rate limits.
github_token = ""
gitlab_token = ""

# Persistence
# Required. Persistent SQLite file URL; relative to the bot's working directory.
# The parent directory must exist and be writable. The file is created if missing.
# Use sqlite:///absolute/path/androidrepo.db for an absolute path.
# The `migrate` subcommand requires only database_url from this file.
database_url = "sqlite://androidrepo.db"
