[package]
name = "androidrepo-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-or-later"
description = "Staff-reviewed Telegram posts from public Android repository evidence"

[dependencies]
ab_glyph = "0.2"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart"] }
scraper = "0.29"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate", "macros"] }
teloxide = { git = "https://github.com/teloxide/teloxide.git", rev = "3c46b96e0dc0cabc75d6430c4566d7e2e12fd233", default-features = false, features = ["rustls", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
missing_docs_in_private_items = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
